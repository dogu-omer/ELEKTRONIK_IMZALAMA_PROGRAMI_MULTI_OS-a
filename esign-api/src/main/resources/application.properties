spring.application.name=esign-api
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.path=/v3/api-docs
# Üretimde kapatılabilir: ESIGN_API_DOCS=false (Swagger UI ve OpenAPI belgesi yayınlanmaz)
springdoc.api-docs.enabled=${ESIGN_API_DOCS:true}
springdoc.swagger-ui.enabled=${ESIGN_API_DOCS:true}
server.error.include-message=never
server.error.include-exception=false
management.endpoint.health.show-details=never
server.server-header=
springdoc.swagger-ui.path=/swagger-ui.html
