name: release
# main'e gönderimde veya v* etiketinde: testler, .deb (Linux), .pkg (macOS), .msi (Windows) ve esign.jar üretilir.
# Tüm sürüm dosyaları Sigstore (cosign, anahtarsız) ve GitHub artifact attestation ile imzalanır.
# pom.xml sürümü (SNAPSHOT değilse) için henüz sürüm yoksa v<sürüm> etiketi ve GitHub Release oluşturulur.
# On push to main or a v* tag: build packages; publish v<pom version> if not released yet.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: SoftHSM test token
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq softhsm2 opensc fakeroot
          scripts/softhsm-setup.sh > "$RUNNER_TEMP/softhsm.env"
          sed 's/^export //; s/'"'"'//g' "$RUNNER_TEMP/softhsm.env" >> "$GITHUB_ENV"
      - run: mvn -B -ntp verify
      - run: packaging/jpackage.sh deb
      - name: Smoke test
        run: |
          sudo dpkg -i dist/*.deb || sudo apt-get -f install -y
          /opt/esign/bin/esign version
      - run: cp esign-cli/target/esign.jar esign-api/target/esign-api.jar dist/
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }
  macos:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp verify   # kart testleri SoftHSM olmadan atlanır
      - run: packaging/jpackage.sh pkg
      - name: Rename
        run: |
          V="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)"
          for f in dist/*.pkg; do mv "$f" "dist/esign-$V-macos-arm64.pkg"; done
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.pkg }
  windows:
    runs-on: windows-latest
    env:
      # İsteğe bağlı Authenticode sırları; tanımlı değilse imza adımları atlanır. Secrets are optional.
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp verify   # kart testleri SoftHSM olmadan atlanır
      - name: MSI (+ PFX imzası varsa) ve kurulum testi
        shell: pwsh
        run: packaging/windows/build-msi.ps1
      - name: Azure Artifact Signing (isteğe bağlı / optional)
        if: env.AZURE_SIGNING_ENDPOINT != '' && env.WINDOWS_PFX_BASE64 == ''
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.msi }
  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write       # Sigstore anahtarsız imza / keyless signing
      attestations: write   # GitHub artifact attestation
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else
            TAG="v$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)"; fi
          SKIP=false
          [[ "$TAG" == *SNAPSHOT* ]] && SKIP=true
          gh release view "$TAG" >/dev/null 2>&1 && SKIP=true
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG skip=$SKIP"
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.skip == 'false'
        with: { path: out, merge-multiple: true }
      - name: Checksums
        if: steps.v.outputs.skip == 'false'
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: sigstore/cosign-installer@v4.1.3
        if: steps.v.outputs.skip == 'false'
      - name: Sigstore imzaları / signatures (her dosya + SHA256SUMS)
        if: steps.v.outputs.skip == 'false'
        run: |
          cd out
          for f in *; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          for f in *.sigstore.json; do
            b="${f%.sigstore.json}"
            cosign verify-blob --bundle "$f" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$b"
          done
          ls -la
      - uses: actions/attest-build-provenance@v4.2.2
        if: steps.v.outputs.skip == 'false'
        with:
          subject-path: |
            out/*.deb
            out/*.pkg
            out/*.msi
            out/*.jar
            out/SHA256SUMS.txt
      - name: Create release
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" out/* --target "$GITHUB_SHA" \
            --title "esign $TAG" --notes-file docs/release-notes.md
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
  image:
    # API kapsayıcısını GitHub Container Registry'ye yayımlar / publishes the API image to GHCR
    needs: publish
    if: needs.publish.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/esign-api"
          docker build -t "$IMG:${TAG#v}" -t "$IMG:latest" .
          docker push "$IMG:${TAG#v}"
          docker push "$IMG:latest"
