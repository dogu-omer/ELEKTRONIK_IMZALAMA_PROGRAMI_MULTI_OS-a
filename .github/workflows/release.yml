name: release
# v* etiketi gönderilince: testler, .deb (Linux), .pkg (macOS) ve esign.jar üretilip GitHub Releases'e yüklenir.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: SoftHSM test token
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq softhsm2 opensc fakeroot
          scripts/softhsm-setup.sh > "$RUNNER_TEMP/softhsm.env"
          sed 's/^export //; s/'"'"'//g' "$RUNNER_TEMP/softhsm.env" >> "$GITHUB_ENV"
      - run: mvn -B -ntp verify
      - run: packaging/jpackage.sh deb
      - name: Smoke test
        run: |
          sudo dpkg -i dist/*.deb || sudo apt-get -f install -y
          /opt/esign/bin/esign version
      - run: cp esign-cli/target/esign.jar dist/
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }
  macos:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -ntp verify   # kart testleri SoftHSM olmadan atlanır
      - run: packaging/jpackage.sh pkg
      - name: Rename
        run: for f in dist/*.pkg; do mv "$f" "${f%.pkg}-macos-arm64.pkg"; done
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.pkg }
  publish:
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "esign $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
